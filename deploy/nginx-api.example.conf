# Фрагмент для сайта на nginx (HTTPS). Положить внутрь server { ... },
# чтобы запросы /api/* шли на PocketSecret.
#
# После правок: sudo nginx -t && sudo systemctl reload nginx

location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # daily-advice и smart-task ждут Google + OpenRouter (до ~120 с на бэкенде); иначе nginx отдаёт 502.
    proxy_connect_timeout 15s;
    proxy_send_timeout 130s;
    proxy_read_timeout 130s;
}
